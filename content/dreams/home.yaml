- id: dream.home.baler_knotter
  weight: 1
  text: >-
    He was under a baler in the yard with the knotter open and the twine
    would not tie. He tied it and it came loose and he tied it again.
    Someone was calling him from the office about a telephone call and he
    said he would come when it was done. The twine was very white. When he
    looked up the yard was empty and the office was dark and the telephone
    was still ringing in it.
  residue: He woke with his hands working at a knot that was not there.
