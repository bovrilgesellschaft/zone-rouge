- id: item.unlabelled_tin
  name: a tin with no label
  plural: tins with no label
  description: A tin with no label. When he shakes it something shifts inside.
  category: food
  weight: 0.45
  barter: 1
  food:
    kcal: 300
    sealed: true
    unknown: true
    contents:
      - key: peas
        kcal: 250
        weight: 4
        text: Peas, grey-green and soft, in a liquor he drank afterward.
      - key: cassoulet
        kcal: 900
        weight: 2
        text: Cassoulet. The beans and the sausage set in white fat and he ate it cold.
      - key: pears
        kcal: 300
        weight: 2
        text: Pears in syrup. He drank the syrup first.
      - key: meat
        kcal: 450
        weight: 2
        text: Meat in a brown jelly. It might have been meant for a dog. He ate it.
      - key: sauerkraut
        kcal: 120
        weight: 2
        text: Sauerkraut. He ate it all and it did nothing for the hunger.
      - key: tomato
        kcal: 80
        weight: 2
        text: Tomato purée, the whole tin of it, sour and thick.
      - key: milk
        kcal: 1000
        weight: 1
        text: Condensed milk. He ate it a fingerful at a time and made it last.
      - key: blown
        kcal: 0
        weight: 1
        text: The tin had blown. The lid was domed and when he put the bayonet to it a smell came out that sent him back from it, and he threw it into the snow.
  notes: Contents drawn when found and shown only when opened. kcal here is the average. Eaten whole on opening.

