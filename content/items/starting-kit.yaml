- id: item.photograph
  name: the photograph
  description:
    steady: A photograph of Ruth Anne Searle and Katherine Mary Searle on the front at Weston-super-Mare, August Bank Holiday 1983. Katie has a 99 and the wind has her hair across her face. Ruth is laughing at something he said from behind the camera.
    frayed: A photograph of Ruth and Katie at the seaside that last summer. Katie is holding an ice cream.
    unmoored: A photograph of his wife and daughter by the sea. He cannot remember what she was laughing at.
    lost: A photograph of a woman and child.
  category: personal
  weight: 0.005
  hasCondition: false
  notes: Wording fixed by the GDD. Looking at it restores a little Hold above Lost and nothing at Lost.

- id: item.two_coins
  name: two coins
  description: Two coins, worn smooth. He does not remember where he came by them.
  category: personal
  weight: 0.01
  bound: true
  barter: 0
  hasCondition: false
  notes: Never dropped, traded, spent or stolen. Never remarked on until the quay. Description never changes.

- id: item.paybook
  name: the paybook
  description: His paybook, AB 64 Part 1, gone soft with damp. His name and number are in it in his own hand.
  category: paper
  weight: 0.03
  hasCondition: false

- id: item.identity_discs
  name: the identity discs
  description: Two identity discs on a cord round his neck.
  category: personal
  weight: 0.01
  hasCondition: false
  notes: Mentioned in the GDD but not in the starting kit table. Added here. Disc pattern for 1983 to be checked before it is described further.

