# What he has when he opens the cabin door. See content/start.yaml for
# where each thing is carried and in what condition.

- id: item.l1a1_rifle
  name: the rifle
  description: An L1A1 self-loading rifle. The furniture is scored and the sling has gone stiff with the cold and the foresight protector is bent where he fell on it.
  category: weapon
  weight: 4.3
  barter: 8
  weapon: { kind: rifle, ammo: 7.62x51, magazine: 20, range: far, damage: 4 }

- id: item.round_762
  name: a round of 7.62mm
  description: A 7.62mm round, brass, the headstamp worn but legible.
  category: ammo
  weight: 0.025
  stackable: true
  barter: 1
  hasCondition: false
  ammo: { kind: 7.62x51 }

- id: item.bayonet
  name: the bayonet
  description: A bayonet in its scabbard. Short and heavy in the blade and no good for much but opening tins.
  category: blade
  weight: 0.4
  barter: 2
  tags: [blade]
  weapon: { kind: melee, range: close, damage: 2, loud: false }

- id: item.woodmans_axe
  name: the axe
  description: A woodman's axe from the cabin. The haft is hickory gone grey with handling and the head has been ground back so many times it is narrow as a hatchet.
  category: tool
  weight: 1.6
  barter: 3
  tags: [axe, blade]
  weapon: { kind: melee, range: close, damage: 3, loud: false }

- id: item.s6_respirator
  name: the respirator
  description: An S6 respirator in its haversack. The rubber has stiffened and the eyepieces are scratched and when he puts it on he hears his own breath.
  category: protection
  weight: 0.9
  barter: 4
  wear: { slot: face, warmth: 0, nbc: true }

- id: item.s6_filter
  name: a filter canister
  description: A filter canister for the respirator.
  category: protection
  weight: 0.25
  stackable: true
  barter: 3

- id: item.nbc_suit
  name: the NBC suit
  description: A charcoal-lined NBC suit, smock and trousers, torn at the left knee and black along the tear where the lining shows.
  category: protection
  weight: 1.2
  barter: 2
  wear: { slot: over, warmth: 1, nbc: true }
  notes: Mk III in the GDD. Mark still to be checked for TA issue in 1983 — do not name the mark in player text until then.

- id: item.dpm_smock
  name: the smock
  description: A DPM combat smock, the cuffs frayed and the hood buttoned away. Over the left breast where the name tape should be there is only a line of small holes where the stitching was.
  category: clothing
  weight: 0.9
  barter: 1
  wear: { slot: body_outer, warmth: 2 }
  plants: [shadow.his_own_body]

- id: item.dpm_trousers
  name: the trousers
  description: DPM trousers, the knees gone through and taped.
  category: clothing
  weight: 0.6
  wear: { slot: legs, warmth: 1 }

- id: item.hunting_coat
  name: the hunting coat
  description: A French hunting coat of green loden that he took from the peg in the cabin. Too wide in the shoulders. A game pocket across the back with old blood dried in the lining.
  category: clothing
  weight: 1.8
  barter: 3
  wear: { slot: over, warmth: 3 }

- id: item.dms_boots
  name: the boots
  description: Boots, DMS, and puttees. The soles are coming away at the toes and the right boot lets in water.
  category: clothing
  weight: 1.5
  barter: 3
  wear: { slot: feet, warmth: 1 }

- id: item.webbing_58
  name: the webbing
